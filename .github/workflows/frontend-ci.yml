name: Frontend CI

on:
  push:
    paths:
      - 'devpilot-web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'devpilot-web/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devpilot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: devpilot-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
