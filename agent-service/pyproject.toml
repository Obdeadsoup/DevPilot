[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "devpilot-agent-service"
version = "0.1.0"
description = "DevPilot Python Agent Runtime service boundary scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 共享 proto 由 grpcio-tools 1.83.1 生成；运行时下限必须匹配生成代码的版本检查。
    "grpcio>=1.83.1,<2",
    "openai>=3.0,<4",
    "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.83,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devpilot_agent_service"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["src/devpilot_agent_service/rpc/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
