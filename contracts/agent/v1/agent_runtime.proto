syntax = "proto3";

package devpilot.agent.v1;

import "google/protobuf/struct.proto";

option java_multiple_files = true;
option java_package = "com.obdeadsoup.devpilot.agent.contract.v1";

// Java 调用 Python 的 Agent Runtime 边界。
service AgentRuntime {
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc StreamRun(StreamRunRequest) returns (stream AgentEvent);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
}

// Python 调用 Java 的受控 Tool Gateway 边界。
service DevPilotToolGateway {
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse);
}

message StartRunRequest {
  string request_id = 1;
  string run_id = 2;
  string user_input = 3;
}

message StartRunResponse {
  string run_id = 1;
  string final_output = 2;
  RunStatus status = 3;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_SUCCEEDED = 1;
  RUN_STATUS_FAILED = 2;
}

message StreamRunRequest {
  string run_id = 1;
  string request_id = 2;
  string user_input = 3;
}

message AgentEvent {
  string event_id = 1;
  string run_id = 2;
  uint64 sequence = 3;
  AgentEventType type = 4;
  uint32 step = 5;
  string tool_name = 6;
  string final_output = 7;
  string failure_kind = 8;
}

enum AgentEventType {
  AGENT_EVENT_TYPE_UNSPECIFIED = 0;
  AGENT_EVENT_TYPE_RUN_STARTED = 1;
  AGENT_EVENT_TYPE_MODEL_STEP_STARTED = 2;
  AGENT_EVENT_TYPE_TOOL_STARTED = 3;
  AGENT_EVENT_TYPE_TOOL_COMPLETED = 4;
  AGENT_EVENT_TYPE_RUN_SUCCEEDED = 5;
  AGENT_EVENT_TYPE_RUN_FAILED = 6;
}

message CancelRunRequest {
  string run_id = 1;
}

message CancelRunResponse {
  bool accepted = 1;
}

message ExecuteToolRequest {
  string request_id = 1;
  string run_id = 2;
  string tool_call_id = 3;
  string tool_name = 4;
  google.protobuf.Struct arguments = 5;
}

message ExecuteToolResponse {
  string result_id = 1;
  string tool_call_id = 2;
  ToolExecutionStatus status = 3;
  google.protobuf.Struct result = 4;
  string error_kind = 5;
}

enum ToolExecutionStatus {
  TOOL_EXECUTION_STATUS_UNSPECIFIED = 0;
  TOOL_EXECUTION_STATUS_SUCCEEDED = 1;
  TOOL_EXECUTION_STATUS_FAILED = 2;
}
