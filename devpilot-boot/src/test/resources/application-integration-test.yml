spring:
  flyway:
    enabled: true
  datasource:
    hikari:
      maximum-pool-size: 6

management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db

devpilot:
  observability:
    backlog:
      enabled: false
  outbox:
    enabled: false
  notification:
    reminder:
      enabled: false
    sse:
      enabled: false
  github:
    base-url: http://127.0.0.1:1
    delivery-recovery-enabled: false
    reconciliation:
      enabled: false
