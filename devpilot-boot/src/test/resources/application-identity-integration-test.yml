spring:
  flyway:
    enabled: true
  datasource:
    hikari:
      maximum-pool-size: 6

management:
  health:
    redis:
      enabled: true

devpilot:
  outbox:
    enabled: false
  notification:
    reminder:
      enabled: false
    sse:
      enabled: false
  identity:
    access-token-ttl: 2h
  github:
    base-url: http://127.0.0.1:1
    delivery-recovery-enabled: false
