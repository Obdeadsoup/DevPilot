spring:
  application:
    name: devpilot-core
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Mailpit 等本地 SMTP sink 不要求认证；生产 SMTP 默认仍要求认证。
      mail.smtp.auth: ${MAIL_AUTH_ENABLED:true}
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLED:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:false}
  config:
    import: optional:nacos:devpilot-core.yml?group=${DEVPILOT_NACOS_GROUP:DEVPILOT}&refreshEnabled=false
  cloud:
    nacos:
      config:
        enabled: ${DEVPILOT_NACOS_CONFIG_ENABLED:false}
        server-addr: ${DEVPILOT_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${DEVPILOT_NACOS_NAMESPACE:}
        group: ${DEVPILOT_NACOS_GROUP:DEVPILOT}
      discovery:
        enabled: ${DEVPILOT_NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${DEVPILOT_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${DEVPILOT_NACOS_NAMESPACE:}
        group: ${DEVPILOT_NACOS_GROUP:DEVPILOT}
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-migration-naming: true

devpilot:
  agent:
    grpc:
      host: ${DEVPILOT_AGENT_GRPC_HOST:localhost}
      port: ${DEVPILOT_AGENT_GRPC_PORT:50051}
      deadline: ${DEVPILOT_AGENT_GRPC_DEADLINE:30s}
      stream-deadline: ${DEVPILOT_AGENT_GRPC_STREAM_DEADLINE:10m}
      cancel-deadline: ${DEVPILOT_AGENT_GRPC_CANCEL_DEADLINE:3s}
      plaintext: ${DEVPILOT_AGENT_GRPC_PLAINTEXT:true}
    resilience:
      max-active-runs: ${DEVPILOT_AGENT_MAX_ACTIVE_RUNS:20}
      sliding-window-size: ${DEVPILOT_AGENT_CIRCUIT_WINDOW_SIZE:10}
      minimum-calls: ${DEVPILOT_AGENT_CIRCUIT_MINIMUM_CALLS:5}
      failure-rate-threshold: ${DEVPILOT_AGENT_CIRCUIT_FAILURE_RATE:50}
      open-state-duration: ${DEVPILOT_AGENT_CIRCUIT_OPEN_DURATION:10s}
      half-open-permitted-calls: ${DEVPILOT_AGENT_CIRCUIT_HALF_OPEN_CALLS:2}
    tool-grpc:
      enabled: ${DEVPILOT_AGENT_TOOL_GRPC_ENABLED:false}
      host: ${DEVPILOT_AGENT_TOOL_GRPC_HOST:127.0.0.1}
      port: ${DEVPILOT_AGENT_TOOL_GRPC_PORT:50052}
      service-key: ${DEVPILOT_AGENT_TOOL_SERVICE_KEY:}
      max-inbound-message-size: 65536
      max-result-bytes: 65536
      worker-threads: 4
      queue-capacity: 64
      shutdown-grace: 5s
    proposal:
      ttl: ${DEVPILOT_AGENT_PROPOSAL_TTL:15m}
      expiration-batch-size: 100
      expiration-scan-interval: ${DEVPILOT_AGENT_PROPOSAL_SCAN_INTERVAL:30s}
    sse:
      enabled: true
      timeout: 30m
      heartbeat-interval: 20s
      max-connections-per-run: 5
      replay-capacity: 64
      terminal-retention: 10m
  observability:
    backlog:
      enabled: true
      refresh-interval: 30s
      stale-after: 2m
  outbox:
    enabled: true
    scan-interval: 5s
    batch-size: 100
    max-retries: 5
    initial-backoff: 1s
    max-backoff: 5m
    processing-timeout: 2m
    worker-core-threads: 2
    worker-max-threads: 4
    worker-queue-capacity: 200
  notification:
    reminder:
      enabled: true
      scan-interval: 1m
      batch-size: 100
      task-due-soon-window: 24h
      task-overdue-escalation-delay: 24h
      task-review-timeout: 24h
      pull-request-review-timeout: 24h
    sse:
      enabled: true
      timeout: 30m
      heartbeat-interval: 20s
      max-connections-per-user: 5
  identity:
    access-token-ttl: 2h
    verification:
      email:
        code-ttl: 5m
        cooldown: 60s
        ip-cooldown: 60s
        failure-ttl: 5m
        max-failures: 5
  github:
    base-url: https://api.github.com
    api-version: 2022-11-28
    connect-timeout: 2s
    read-timeout: 5s
    max-read-attempts: 3
    initial-backoff: 200ms
    max-backoff: 2s
    max-synchronous-rate-limit-wait: 3s
    max-concurrent-requests-per-credential: 2
    concurrency-acquire-timeout: 200ms
    user-agent: DevPilot
    worker-core-threads: 2
    worker-max-threads: 4
    worker-queue-capacity: 200
    webhook-max-payload-bytes: 2097152
    delivery-max-retries: 3
    delivery-retry-initial-delay: 10s
    delivery-retry-max-delay: 5m
    delivery-recovery-scan-interval: 10s
    delivery-recovery-batch-size: 50
    delivery-processing-timeout: 2m
    delivery-recovery-enabled: true
    reconciliation:
      enabled: true
      scan-interval: 5m
      batch-size: 25
      initial-lookback: 7d
      overlap-window: 5m
      max-run-attempts: 5
      per-page: 100
      run-timeout: 15m
      retry-initial-delay: 1m
      retry-max-delay: 30m

management:
  health:
    # 非 SMTP Profile 不应因为默认外部邮件主机影响整体健康；Full Compose 显式开启并检查 Mailpit。
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
    nacos-config:
      enabled: false
    nacos-discovery:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
