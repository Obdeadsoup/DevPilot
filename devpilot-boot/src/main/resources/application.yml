spring:
  application:
    name: devpilot
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-migration-naming: true

devpilot:
  github:
    api-base-url: https://api.github.com
    connect-timeout: 3s
    read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
